name: Wochenmail

on:
  schedule:
    - cron: "0 6 * * 1"   # montags 06:00 UTC (GitHub startet teils verspätet)
  workflow_dispatch:
    inputs:
      nur_test:
        description: "Nur Testmail an die Testadresse (Secret MAIL_TEST_TO) statt an den Verteiler"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finder/requirements.txt
      - run: pip install -r finder/requirements.txt
      - name: Wochenübersicht senden
        working-directory: finder
        env:
          SOVRADAR_TENDER_KEY: ${{ secrets.SOVRADAR_TENDER_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TEST_TO: ${{ secrets.MAIL_TEST_TO }}
          MAIL_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.nur_test }}
        run: python send_digest.py --days 7
