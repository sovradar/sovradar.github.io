name: Aktualitaetspruefung Steckbriefe

on:
  schedule:
    - cron: "0 4 1 * *"   # monatlich am 1., 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Seiten neu auswerten (auch unveränderte)"
        type: boolean
        default: false
      provider:
        description: "Nur diesen Anbieter (id, z. B. noris) – leer = alle"
        default: ""

permissions:
  contents: write

concurrency:
  group: pruefung
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finder/requirements.txt
      - run: pip install -r finder/requirements.txt
      - name: Quellseiten prüfen
        working-directory: finder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SOVRADAR_TENDER_KEY: ${{ secrets.SOVRADAR_TENDER_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.provider }}" ]; then ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"; fi
          python pruef_monitor.py $ARGS
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "sovradar-pruefung"
          git config user.email "sovradar-pruefung@users.noreply.github.com"
          git add pruefstand.enc.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Aktualitätsprüfung"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
