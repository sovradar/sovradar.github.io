name: Ausschreibungsfinder

on:
  schedule:
    - cron: "15 5 * * *"   # täglich 05:15 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Suchzeitraum in Tagen"
        default: "3"

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finder/requirements.txt
      - run: pip install -r finder/requirements.txt
      - name: Suchen und bewerten
        working-directory: finder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SOVRADAR_TENDER_KEY: ${{ secrets.SOVRADAR_TENDER_KEY }}
        run: python run_finder.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Ergebnis speichern
        run: |
          git config user.name "sovradar-finder"
          git config user.email "sovradar-finder@users.noreply.github.com"
          git add tenders.enc.json
          git diff --cached --quiet || git commit -m "Ausschreibungen aktualisiert"
          git push
      - name: Bei Konfigurationsfehler rot markieren
        if: always()
        working-directory: finder
        env:
          SOVRADAR_TENDER_KEY: ${{ secrets.SOVRADAR_TENDER_KEY }}
        run: python -c "import run_finder as r,sys; s=r.load_state(); e=(s['runs'] or [{}])[0].get('config_error'); print(e or 'ok'); sys.exit(1 if e else 0)"
